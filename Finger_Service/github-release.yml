# Copy to .github/workflows/release.yml in anubis-098/finger_service.
# Repository root must contain the Finger_Service directory from this project.
name: Release Finger Service
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        shell: pwsh
        run: |
          [xml]$project = Get-Content Finger_Service/FingerService.csproj
          if ("v$($project.Project.PropertyGroup.Version)" -ne $env:GITHUB_REF_NAME) { throw 'Tag and project version must match' }
      - name: Build package
        shell: pwsh
        run: ./Finger_Service/release.ps1
      - name: Test folder package
        shell: pwsh
        run: |
          $env:CJ_FINGER_SERVICE_DATA=Join-Path $env:RUNNER_TEMP 'finger-package-tests'
          $env:CJ_FINGER_TEST_PACKAGE=(Resolve-Path 'Finger_Service/release/CJFingerService-win-x64-folder.zip').Path
          $test=Start-Process -FilePath (Resolve-Path 'Finger_Service/release/folder/CJFingerService.exe').Path -ArgumentList '--self-test' -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw 'Folder package tests failed' }
          Get-Content (Join-Path $env:CJ_FINGER_SERVICE_DATA 'update-test-result.txt')
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME Finger_Service/release/CJFingerService-win-x64.zip Finger_Service/release/SHA256.txt Finger_Service/release/CJFingerService-win-x64-folder.zip Finger_Service/release/Folder-SHA256.txt Finger_Service/release/CJFingerService-UbuntuOCR.zip Finger_Service/release/UbuntuOCR-SHA256.txt --repo $env:GITHUB_REPOSITORY --title "Finger Service $env:GITHUB_REF_NAME" --notes-file Finger_Service/RELEASE-NOTES.md
