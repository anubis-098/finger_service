# Copy to .github/workflows/release.yml in anubis-098/finger_service.
# Repository root must contain the Finger_Service directory from this project.
name: Release Finger Service
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        shell: pwsh
        run: |
          [xml]$project = Get-Content Finger_Service/FingerService.csproj
          if ("v$($project.Project.PropertyGroup.Version)" -ne $env:GITHUB_REF_NAME) { throw 'Tag and project version must match' }
      - name: Build package
        shell: pwsh
        run: ./Finger_Service/release.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME Finger_Service/release/CJFingerService-win-x64.zip Finger_Service/release/SHA256.txt --repo $env:GITHUB_REPOSITORY --title "Finger Service $env:GITHUB_REF_NAME" --generate-notes
